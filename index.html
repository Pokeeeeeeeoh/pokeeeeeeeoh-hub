    <div id="root"></div>
    <script>
      (function () {
        var host = window.location.hostname;
        var isPreviewHost =
          host.indexOf('id-preview--') !== -1 ||
          host.indexOf('.lovableproject.com') !== -1;

        if (!isPreviewHost) {
          var manifest = document.createElement('link');
          manifest.rel = 'manifest';
          manifest.href = '/manifest.webmanifest';
          document.head.appendChild(manifest);
        }

        var isStandalone = window.navigator.standalone === true;
        try {
          isStandalone = isStandalone || window.matchMedia('(display-mode: standalone)').matches;
        } catch (e) {}

        if (!isStandalone || !isPreviewHost) return;

        // Only redirect preview standalone launches to production
        var targetUrl =
          'https://pokeeeeeeeoh.com' +
          window.location.pathname +
          window.location.search +
          window.location.hash;
        window.location.replace(targetUrl);
      })();
    </script>
